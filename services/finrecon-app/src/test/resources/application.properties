# Test profile: H2 in-memory, Flyway off, Hibernate create-drop.
# This never validates the PostgreSQL migrations; see db/tests + DATABASE.md.
# Unique DB name per test class to isolate shared FK constraints.
spring.datasource.url=jdbc:h2:mem:finrecon-${random.uuid};DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

# No Redis in tests: keep the broker-less UP contract green.
management.health.redis.enabled=false

# P12 probes (repeated: test classpath shadows main properties).
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.readiness.include=db,diskSpace

finrecon.frontend.origin=http://localhost:3000
