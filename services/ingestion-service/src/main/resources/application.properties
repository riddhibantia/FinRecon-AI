server.port=8081
spring.application.name=ingestion-service
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# P1: PostgreSQL is the system of record. Schema is owned by
# db/migrations and applied by Flyway; Hibernate validates only.
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:finrecon}
spring.datasource.username=${POSTGRES_USER:finrecon}
spring.datasource.password=${POSTGRES_PASSWORD:changeme}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=filesystem:db/migrations

# P5: messaging stays OFF unless a broker deployment enables it, so the
# service boots with no Kafka/Redis present. Placeholders resolve to
# localhost only when enabled.
finrecon.messaging.enabled=false
finrecon.redis.enabled=false
# Redis health stays off with the optional Redis: a broker-less service
# must keep reporting UP (P0 contract). Broker deployments that enable
# Redis should set management.health.redis.enabled=true as well.
management.health.redis.enabled=false
finrecon.topics.ingest=finrecon.ingest.v1
finrecon.consumer.group=finrecon-ingestion
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
