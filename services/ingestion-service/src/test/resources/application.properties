# P1 test profile. H2 serves @SpringBootTest only: Flyway stays off and
# Hibernate generates its own throwaway schema, so these tests never
# validate the PostgreSQL migrations. Migration checks live in db/tests.
spring.datasource.url=jdbc:h2:mem:finrecon;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
# Test classpath shadows main application.properties wholesale (same
# classpath location), so flags the tests rely on must repeat here.
# No Redis in tests either: keep the broker-less UP contract green.
management.health.redis.enabled=false
# P12 probes (repeated: test classpath shadows main properties).
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.readiness.include=db,diskSpace
