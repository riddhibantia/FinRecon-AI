# Minimal compose for 8GB RAM: only PostgreSQL.
# Run the monolith with: gradle :services:finrecon-app:bootRun
# Run the AI service with: cd ai-service && python -m uvicorn app:app --port 8000
# Run the frontend with: cd frontend && npm run dev
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finrecon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finrecon}
      POSTGRES_USER: ${POSTGRES_USER:-finrecon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finrecon}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: