# P5 local services. Postgres always; Kafka + Redis for the P5 async path.
# pgvector image keeps the P7 RAG option open without enabling RAG.
# P12 app services below (gateway/reporting join when they serve traffic).
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finrecon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finrecon}
      POSTGRES_USER: ${POSTGRES_USER:-finrecon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finrecon}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # P5: single-node Kafka (KRaft, no ZooKeeper) for finrecon.ingest.v1.
  kafka:
    image: apache/kafka:3.8.0
    container_name: finrecon-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL for containers, EXTERNAL for host tools: each side gets an
      # address it can actually reach (single-advertise breaks one side).
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Single-node dev broker: internal topics must fit on one replica or
      # the group coordinator never comes up (default asks for 3).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 8

  # P5: dedupe cache for consumer eventIds.
  redis:
    image: redis:7.4
    container_name: finrecon-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # P12: application services. Build with `docker compose up --build`.
  # Messaging stays off unless enabled; see OPERATIONS.md.
  ingestion-service:
    build:
      context: .
      dockerfile: services/ingestion-service/Dockerfile
    container_name: finrecon-ingestion
    restart: unless-stopped
    ports:
      - "${INGESTION_PORT:-8081}:8081"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-finrecon}
      POSTGRES_USER: ${POSTGRES_USER:-finrecon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
      finrecon_messaging_enabled: "true"
      finrecon_redis_enabled: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  reconciliation-service:
    build:
      context: .
      dockerfile: services/reconciliation-service/Dockerfile
    container_name: finrecon-reconciliation
    restart: unless-stopped
    ports:
      - "${RECONCILIATION_PORT:-8082}:8082"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-finrecon}
      POSTGRES_USER: ${POSTGRES_USER:-finrecon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
    depends_on:
      postgres:
        condition: service_healthy

  exception-service:
    build:
      context: .
      dockerfile: services/exception-service/Dockerfile
    container_name: finrecon-exception
    restart: unless-stopped
    ports:
      - "${EXCEPTION_PORT:-8083}:8083"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-finrecon}
      POSTGRES_USER: ${POSTGRES_USER:-finrecon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: finrecon-ai
    restart: unless-stopped
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    environment:
      FINRECON_CASE_API_URL: http://exception-service:8083
      FINRECON_MODEL_DIR: /models
    volumes:
      - ./ai-service/artifacts/p6/models:/models:ro
    depends_on:
      exception-service:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: finrecon-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      FINRECON_RECON_API_URL: http://reconciliation-service:8082
      FINRECON_CASE_API_URL: http://exception-service:8083
      FINRECON_AI_API_URL: http://ai-service:8000
      FINRECON_GATEWAY_API_URL: http://gateway-service:8080
      FINRECON_INGEST_API_URL: http://ingestion-service:8081
      FINRECON_REPORTING_API_URL: http://reporting-service:8084
    depends_on:
      - reconciliation-service
      - exception-service
      - ai-service

volumes:
  pgdata:
