# P5 local services. Postgres always; Kafka + Redis for the P5 async path.
# pgvector image keeps the P7 RAG option open without enabling RAG.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finrecon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finrecon}
      POSTGRES_USER: ${POSTGRES_USER:-finrecon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finrecon}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # P5: single-node Kafka (KRaft, no ZooKeeper) for finrecon.ingest.v1.
  kafka:
    image: apache/kafka:3.8.0
    container_name: finrecon-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b localhost:9092 1 5"]
      interval: 15s
      timeout: 10s
      retries: 8

  # P5: dedupe cache for consumer eventIds.
  redis:
    image: redis:7.4
    container_name: finrecon-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
