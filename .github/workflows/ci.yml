name: ci

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# P12 quality gates: every phase merges only with all jobs green.
on:
  push:
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v3
      - run: gradle clean build

  python-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: ai-service
      # Full OMP regression: classifier, RAG, agent, boundaries.
      - run: python -m pytest -q
        working-directory: ai-service

  python-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Migration/schema validation + tracked-file hygiene (stdlib only).
      - run: python -m pytest db/tests tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose config --services

  docker:
    runs-on: ubuntu-latest
    needs: [java, python-ai, frontend]
    strategy:
      matrix:
        image:
          - { context: ., file: services/finrecon-app/Dockerfile, tag: finrecon-app }
          - { context: ., file: ai-service/Dockerfile, tag: finrecon-ai }
          - { context: ., file: frontend/Dockerfile, tag: finrecon-frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f ${{ matrix.image.file }} -t ${{ matrix.image.tag }}:ci ${{ matrix.image.context }}

  coverage:
    runs-on: ubuntu-latest
    needs: [java, python-ai, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v3
      - run: gradle clean build
      - name: Summarize JaCoCo line coverage
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          missed = covered = 0
          for path in glob.glob("services/*/build/reports/jacoco/test/jacocoTestReport.xml"):
              for counter in ET.parse(path).getroot().iter("counter"):
                  if counter.get("type") == "LINE":
                      missed += int(counter.get("missed"))
                      covered += int(counter.get("covered"))
          total = missed + covered or 1
          print(f"java line coverage: {covered}/{total} = {covered/total:.3f}")
          EOF

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
        working-directory: ai-service
      - run: pip-audit --desc=off --local
        working-directory: ai-service
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
