name: ci

# P12 quality gates: every phase merges only with all jobs green.
on:
  push:
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v3
      - run: gradle clean build

  python-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
        working-directory: ai-service
      # Full OMP regression: classifier, RAG, agent, boundaries.
      - run: python -m pytest -q
        working-directory: ai-service

  python-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Migration/schema validation + tracked-file hygiene (stdlib only).
      - run: python -m pytest db/tests tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose config --services

  docker:
    runs-on: ubuntu-latest
    needs: [java, python-ai, frontend]
    strategy:
      matrix:
        image:
          - { context: ., file: services/gateway-service/Dockerfile, tag: finrecon-gateway }
          - { context: ., file: services/ingestion-service/Dockerfile, tag: finrecon-ingestion }
          - { context: ., file: services/reconciliation-service/Dockerfile, tag: finrecon-reconciliation }
          - { context: ., file: services/exception-service/Dockerfile, tag: finrecon-exception }
          - { context: ., file: services/reporting-service/Dockerfile, tag: finrecon-reporting }
          - { context: ., file: ai-service/Dockerfile, tag: finrecon-ai }
          - { context: ., file: frontend/Dockerfile, tag: finrecon-frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f ${{ matrix.image.file }} -t ${{ matrix.image.tag }}:ci ${{ matrix.image.context }}
