name: ci

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# P12 quality gates: every phase merges only with all jobs green.
on:
  push:
  pull_request:

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v3
      - run: gradle clean build

  python-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: ai-service
      # Full OMP regression: classifier, RAG, agent, boundaries.
      - run: python -m pytest -q
        working-directory: ai-service

  python-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Migration/schema validation + tracked-file hygiene (stdlib only).
      - run: python -m pytest db/tests tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose config --services

  docker:
    runs-on: ubuntu-latest
    needs: [java, python-ai, frontend]
    strategy:
      matrix:
        image:
          - { context: ., file: services/finrecon-app/Dockerfile, tag: finrecon-app }
          - { context: ., file: ai-service/Dockerfile, tag: finrecon-ai }
          - { context: ., file: frontend/Dockerfile, tag: finrecon-frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f ${{ matrix.image.file }} -t ${{ matrix.image.tag }}:ci ${{ matrix.image.context }}

  screenshots:
    runs-on: ubuntu-latest
    needs: [java, python-ai, frontend]
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: finrecon
          POSTGRES_USER: finrecon
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U finrecon"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v3
      - name: Start monolith
        run: |
          gradle :services:finrecon-app:bootRun --no-daemon > boot.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/health > /dev/null; then
              echo "backend is up"; break
            fi
            sleep 10
          done
          curl -sf http://localhost:8080/api/health || (tail -n 200 boot.log; exit 1)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - name: Start ai-service
        working-directory: ai-service
        run: |
          pip install -r requirements.txt
          nohup python -m uvicorn app:app --port 8000 > ../ai.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:8000/health; then
              echo "ai-service is up"; break
            fi
            sleep 10
          done
          curl -s -o /dev/null http://localhost:8000/health || (tail -n 200 ../ai.log; exit 1)
      - name: Seed demo data
        run: python scripts/demo.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          (npm run start -- --port 3000 > ../frontend.log 2>&1 &)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "frontend is up"; break
            fi
            sleep 10
          done
          curl -sf http://localhost:3000/api/health || (tail -n 200 ../frontend.log; exit 1)
      - name: Capture screenshots
        run: |
          mkdir -p docs/screenshots
          shot() { google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,2400 --screenshot="$1" "$2"; }
          shot docs/screenshots/home.png http://localhost:3000/
          shot docs/screenshots/cases.png http://localhost:3000/cases
          CASE_ID=$(python3 -c "import json,urllib.request; q=json.load(urllib.request.urlopen('http://localhost:8080/api/cases',timeout=60)); print(q[0]['exceptionId'] if isinstance(q,list) and q else '')")
          if [ -n "$CASE_ID" ]; then
            shot docs/screenshots/case-detail.png "http://localhost:3000/cases/$CASE_ID"
          fi
          shot docs/screenshots/metrics.png http://localhost:3000/metrics
          shot docs/screenshots/metrics-table.png "http://localhost:3000/metrics?view=table"
          ls -la docs/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error

  coverage:
    runs-on: ubuntu-latest
    needs: [java, python-ai, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v3
      - run: gradle clean build
      - name: Summarize JaCoCo line coverage
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          missed = covered = 0
          for path in glob.glob("services/*/build/reports/jacoco/test/jacocoTestReport.xml"):
              for counter in ET.parse(path).getroot().iter("counter"):
                  if counter.get("type") == "LINE":
                      missed += int(counter.get("missed"))
                      covered += int(counter.get("covered"))
          total = missed + covered or 1
          print(f"java line coverage: {covered}/{total} = {covered/total:.3f}")
          EOF

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
        working-directory: ai-service
      - run: pip-audit --desc=off --local
        working-directory: ai-service
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
